input {
  beats {
    port => 5044
  }
}

filter {
  grok {
    match => {
      "message" => "%{HOSTNAME:host} %{HTTPDATE:timestamp} \"%{WORD:method} %{URIPATHPARAM:url} HTTP/%{NUMBER:http_version}\" %{NUMBER:response} %{NUMBER:bytes}"
    }
  }

  date {
    match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
    target => "@timestamp"
  }

  ruby {
    code => "
      url = event.get('url')
      if url
        parts = url.split('/')
        if parts.length > 1
          event.set('url_category', parts[1])
        else
          event.set('url_category', 'root')
        end
      end
    "
  }

  geoip {
    source => "host"
    target => "geoip"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "nasa-logs"
  }
}
